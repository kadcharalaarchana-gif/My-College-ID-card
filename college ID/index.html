<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My College ID Card</title>
</head>
<body>
   
        <div class="card-container">
         <div class="id-card">

            <!--Header Section-->

            <header class="card-header">
                <img src="image.jpg" alt="college logo" class="logo">
                <p class="college">Pragnya Womens Degree College</p>
                
             </header>

             <!--photo-->
         
        <div class="photo-wrap">
        <img src="myimage.jpeg" alt="profile photo" class="photo"></div>

        <main class="card-body">

        <div class="name-section">
            <h2 class="student-name"> Archana Kadcharala</h2>
            <p class="student-name">Pragnya Womens Degree College</p>
        </div>

        <hr class="divider">
        <div class="details">
            <p><strong>Course:</strong>BCA </p>
            <p><strong>Graducation Year:</strong>2024-2027</p>
        </div>

        <div class="id-line">
            <span class="id-label">ID-No.</span>
            <span class="id-value">ID-value</span>
        </div>

        <div class="barcode"></div>
        </main>

        <footer class="card-footer">
            <p class="footer-text">Issued by:College </p>
        </footer>



            </div>   
        </div>
    
    
</body>
</html>
